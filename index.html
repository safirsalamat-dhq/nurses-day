<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کارت پستال تبریک روز پرستار</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --primary-color: #004b87;
            --secondary-color: #00a8b5;
            --card-bg: #ffffff;
            --text-color: #333;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
        
        /* پس زمینه میز (شبیه کارت پستال) */
        body {
            background-color: #e0e5ec;
            background-image: linear-gradient(45deg, #e0e5ec 25%, transparent 25%, transparent 75%, #e0e5ec 75%, #e0e5ec), linear-gradient(45deg, #e0e5ec 25%, transparent 25%, transparent 75%, #e0e5ec 75%, #e0e5ec);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* المان ضربان قلب در پس زمینه */
        .bg-heartbeat {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.05;
            z-index: 0;
            width: 150vw;
            pointer-events: none;
        }

        /* بدنه کارت پستال */
        .postcard {
            position: relative;
            z-index: 1;
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.1),
                0 0 0 10px rgba(255,255,255,0.5); /* حاشیه سفید دور کارت */
            border: 1px solid #ddd;
            animation: dropIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transform: translateY(-50px);
            opacity: 0;
        }

        /* تزئینات گوشه کارت */
        .postcard::before, .postcard::after {
            content: '';
            position: absolute;
            width: 50px;
            height: 50px;
            border: 2px solid var(--secondary-color);
            opacity: 0.3;
        }
        .postcard::before { top: 15px; right: 15px; border-left: none; border-bottom: none; border-radius: 0 10px 0 0; }
        .postcard::after { bottom: 15px; left: 15px; border-right: none; border-top: none; border-radius: 0 0 0 10px; }

        /* استایل لوگو */
        .logo {
            width: 160px;
            height: auto;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--secondary-color);
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 2rem;
            display: inline-block;
            padding: 4px 15px;
            background: rgba(0, 168, 181, 0.1);
            border-radius: 20px;
        }

        .message {
            color: #555;
            line-height: 2;
            font-size: 0.95rem;
            text-align: justify;
            margin-bottom: 2.5rem;
        }

        .signature {
            font-weight: bold;
            color: var(--primary-color);
            font-size: 1.1rem;
            margin-top: 1rem;
            display: block;
        }

        /* دکمه ها */
        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
            box-shadow: 0 4px 10px rgba(0, 75, 135, 0.2);
        }
        .btn-primary:hover { background: #003666; transform: translateY(-2px); }

        .btn-secondary {
            background: white;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
        }
        .btn-secondary:hover { background: #f0f4f8; }

        /* انیمیشن ها */
        @keyframes dropIn {
            from { opacity: 0; transform: translateY(-50px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        #toast {
            visibility: hidden;
            min-width: 200px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 12px;
            position: fixed;
            z-index: 10;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }
        #toast.show { visibility: visible; opacity: 1; bottom: 40px; }
    </style>
</head>
<body>

    <svg class="bg-heartbeat" viewBox="0 0 500 100" preserveAspectRatio="none">
        <path d="M0,50 L150,50 L170,20 L190,80 L210,50 L250,50 L270,10 L290,90 L310,50 L500,50" fill="none" stroke="var(--primary-color)" stroke-width="2"/>
    </svg>

    <div class="postcard">
        <!-- نام فایل لوگو باید logo.png باشد -->
        <img src="logo.png" alt="لوگو" class="logo">
        
        <h1>روز پرستار گرامی باد</h1>
        <div class="subtitle">کانون دانشجویی سلامت و پرستاری</div>
        
        <div class="message">
            <p>همکاران و اساتید گرامی، دانشجویان پرتلاش،</p>
            <p>وجود شما نماد امید و آرامش است. دستانی که مرهم دردند و قلب‌هایی که برای سلامت دیگران می‌تپند. شما فرشتگان نجات در لباس سفید هستید.</p>
            <span class="signature">با احترام و سپاس، کانون سلامت و پرستاری</span>
        </div>

        <div class="actions">
            <button class="btn btn-primary" onclick="sharePage()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                اشتراک‌گذاری کارت
            </button>
            <button class="btn btn-secondary" onclick="copyLink()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                کپی لینک
            </button>
        </div>
    </div>

    <div id="toast">لینک کپی شد!</div>

    <script>
        function sharePage() {
            if (navigator.share) {
                navigator.share({ title: 'تبریک روز پرستار', text: 'این کارت پستال زیبا رو ببین!', url: window.location.href });
            } else { copyLink(); }
        }
        function copyLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                const toast = document.getElementById("toast");
                toast.className = "show";
                setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
            });
        }
    </script>
</body>
</html>
